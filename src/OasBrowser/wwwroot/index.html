<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app's own name, not any corpus's. Which corpus this copy shows is
         decided at runtime by the catalogue it loads, and a static tag cannot
         know that, so this is what a reader sees while the app boots and what a
         crawler that does not run the WASM sees for good. Once the catalogue
         arrives, Shell.razor's PageTitle replaces the title with the brand the
         catalogue declared; nothing replaces the description, because Blazor
         appends head content rather than merging it and a second description
         tag is worse than a generic one. -->
    <title>API browser</title>
    <meta name="description" content="Browsable reference for an OpenAPI catalogue." />
    <!-- Where this app is published: GitHub Pages serves this repository under
         /oas-browser/. Every path the app resolves hangs off this, and so does
         the import map fingerprint-importmap.py writes after publish, because
         import map keys are resolved specifiers and one keyed on anything else
         will not resolve. The build workflow asserts this value, since the
         publish path belongs to the repository and not to the app.

         Do not hand-write an import map here. That script adds one to the
         published copy, keyed on this base href and pointing at the runtime
         hash of the build it just ran against, and it leaves a document that
         already has one alone. A map written here would therefore survive into
         every later publish still naming a runtime that build did not
         produce, and the site would 404 on its first import. -->
    <base href="/oas-browser/" />
    <link rel="icon" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="_content/Keel/keel.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="state">
            <div class="state__spinner"></div>
            Loading the API browser…
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Reload the page to try again.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">&times;</span>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
